<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Computer-Use Console</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="console">
    <aside class="sidebar">
      <h2>Target</h2>
      <div id="target-switcher" class="target-switcher">
        <button type="button" class="target-btn muted" disabled>Loading…</button>
      </div>

      <details class="catalog-details">
        <summary>Capability catalog</summary>
        <ul id="catalog-list" class="catalog-list">
          <li class="muted">Loading…</li>
        </ul>
      </details>

      <h2>Demo scripts</h2>
      <p class="hint">Sends the same message a person could type, through the same chat path.</p>
      <div id="demo-scripts" class="demo-scripts"></div>

      <a id="dashboard-link" class="dashboard-link" href="#" target="_blank" rel="noopener" hidden>Open ops dashboard ↗</a>
    </aside>

    <div class="chat-app">
      <header>
        <h1>Member Assistant</h1>
        <p class="subtitle">Type or talk — ask to open an account, look up a member, and more.</p>
      </header>

      <div id="interventions" class="interventions" hidden></div>

      <main id="messages" class="messages" aria-live="polite"></main>

      <form id="composer" class="composer">
        <button type="button" id="mic-btn" class="icon-btn" title="Speak your request" aria-label="Speak your request">🎙️</button>
        <input
          id="input"
          type="text"
          placeholder="e.g. Open a savings account for member 10001 with $100"
          autocomplete="off"
        />
        <button type="submit" class="send-btn">Send</button>
      </form>

      <div class="footer-row">
        <label class="speak-toggle"><input type="checkbox" id="speak-toggle" /> Read replies aloud</label>
        <span id="mic-status" class="mic-status" hidden>Listening…</span>
      </div>
    </div>
  </div>

  <script src="/chat.js"></script>
</body>
</html>
